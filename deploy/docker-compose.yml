name: yeson-meet

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-yeson}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-yeson_meet}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-yeson} -d ${DB_NAME:-yeson_meet}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Localhost-only port exposure for dev tooling (alembic/psql from host).
    # Production behind LAN can remove this — server already reaches postgres
    # on the compose network without it.
    ports:
      - "127.0.0.1:5432:5432"

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-yeson}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-yeson_meet}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live-preview}
      GEMINI_FAST_PARTIAL_TRANSLATION_ENABLED: ${GEMINI_FAST_PARTIAL_TRANSLATION_ENABLED:-1}
      GEMINI_PARTIAL_TRANSLATION_MODEL: ${GEMINI_PARTIAL_TRANSLATION_MODEL:-gemini-2.5-flash-lite}
      GEMINI_PARTIAL_MIN_CHARS: ${GEMINI_PARTIAL_MIN_CHARS:-12}
      GEMINI_PARTIAL_MIN_WORDS: ${GEMINI_PARTIAL_MIN_WORDS:-2}
      GEMINI_PARTIAL_MIN_DELTA_CHARS: ${GEMINI_PARTIAL_MIN_DELTA_CHARS:-6}
      GEMINI_PARTIAL_FORCE_CHARS: ${GEMINI_PARTIAL_FORCE_CHARS:-90}
      GEMINI_EXPLICIT_VAD_ENABLED: ${GEMINI_EXPLICIT_VAD_ENABLED:-0}
      GEMINI_EXPLICIT_VAD_RMS_DBFS_THRESHOLD: ${GEMINI_EXPLICIT_VAD_RMS_DBFS_THRESHOLD:--50}
      GEMINI_EXPLICIT_VAD_END_SILENCE_MS: ${GEMINI_EXPLICIT_VAD_END_SILENCE_MS:-320}
      GEMINI_EXPLICIT_VAD_MAX_SPEECH_MS: ${GEMINI_EXPLICIT_VAD_MAX_SPEECH_MS:-2500}
      GEMINI_SEGMENT_MAX_SPEECH_MS: ${GEMINI_SEGMENT_MAX_SPEECH_MS:-120000}
      GEMINI_SEGMENT_HARD_MAX_SPEECH_MS: ${GEMINI_SEGMENT_HARD_MAX_SPEECH_MS:-300000}
      GEMINI_SEGMENT_CYCLE_SILENCE_MS: ${GEMINI_SEGMENT_CYCLE_SILENCE_MS:-400}
      GEMINI_RESPONSE_MODALITY: ${GEMINI_RESPONSE_MODALITY:-AUDIO}
      GEMINI_VAD_PREFIX_PADDING_MS: ${GEMINI_VAD_PREFIX_PADDING_MS:-120}
      GEMINI_VAD_SILENCE_DURATION_MS: ${GEMINI_VAD_SILENCE_DURATION_MS:-350}
      GEMINI_RECEIVE_POLL_TIMEOUT_MS: ${GEMINI_RECEIVE_POLL_TIMEOUT_MS:-200}
      GEMINI_RECEIVE_DRAIN_TIMEOUT_MS: ${GEMINI_RECEIVE_DRAIN_TIMEOUT_MS:-12000}
      GEMINI_PARTIAL_TRANSLATION_TIMEOUT_MS: ${GEMINI_PARTIAL_TRANSLATION_TIMEOUT_MS:-2000}
      GEMINI_SEGMENT_SPEECH_RMS_DBFS_THRESHOLD: ${GEMINI_SEGMENT_SPEECH_RMS_DBFS_THRESHOLD:--60}
      YESON_AI_PROVIDER: ${YESON_AI_PROVIDER:-gemini_live}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}
      GOOGLE_STT_LANGUAGE_CODE: ${GOOGLE_STT_LANGUAGE_CODE:-en-US}
      GOOGLE_TRANSLATE_TARGET_LANGUAGE: ${GOOGLE_TRANSLATE_TARGET_LANGUAGE:-ko}
      GOOGLE_TRANSLATE_LOCATION: ${GOOGLE_TRANSLATE_LOCATION:-global}
      ACCESS_MODE: ${ACCESS_MODE:-lan}
      SERVER_HOST: ${SERVER_HOST:-localhost}
      STORAGE_ROOT: /var/lib/yeson-meet/storage
    volumes:
      - ./data/storage:/var/lib/yeson-meet/storage
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    # Localhost-only port exposure for dev tooling (Vite proxy /api /ws).
    # Production behind Caddy can omit this — Caddy reaches server on the
    # compose network without host port binding.
    ports:
      - "127.0.0.1:8000:8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_HOST: ${SERVER_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
      - ../apps/web/dist:/srv/web:ro
    depends_on:
      - server
