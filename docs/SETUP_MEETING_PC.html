<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>yeson-meet · 회의실 PC 셋업 가이드</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
      background:
        radial-gradient(circle at 5% -5%, rgba(59,130,246,.18), transparent 30%),
        radial-gradient(circle at 95% -5%, rgba(168,85,247,.16), transparent 28%),
        #f3f6fb;
      min-height:100vh;
    }
    .glass{ background:rgba(255,255,255,.92); backdrop-filter: blur(8px); border:1px solid rgba(15,23,42,.08); }
    .code{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .step-done{ opacity:.55; }
    .step-done .step-title{ text-decoration: line-through; }
    details summary{ cursor:pointer; user-select:none; }
    details[open] summary .chev{ transform: rotate(90deg); }
    .chev{ transition: transform .18s; display:inline-block; }
    .os-tab{
      flex:1; padding:14px 16px; border-radius:14px; font-weight:900;
      text-align:center; cursor:pointer; border:2px solid transparent;
      background:rgba(255,255,255,.7);
    }
    .os-tab.active-mac{ background:linear-gradient(180deg,#2563eb,#1e40af); color:white; border-color:#1e3a8a; box-shadow: 0 10px 25px rgba(37,99,235,.35); }
    .os-tab.active-win{ background:linear-gradient(180deg,#16a34a,#15803d); color:white; border-color:#14532d; box-shadow: 0 10px 25px rgba(22,163,74,.35); }
    @media print{
      .no-print{ display:none !important; }
      body{ background:white; }
    }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ========== 부품 ========== */
const useChecklist = (key) => {
  const [done, setDone] = useState(() => {
    try { return JSON.parse(localStorage.getItem(key) || "{}"); } catch { return {}; }
  });
  const toggle = (id) => setDone(d => {
    const next = {...d, [id]: !d[id]};
    localStorage.setItem(key, JSON.stringify(next));
    return next;
  });
  const reset = () => { setDone({}); localStorage.removeItem(key); };
  return { done, toggle, reset };
};

const CopyBtn = ({text}) => {
  const [copied, setCopied] = useState(false);
  return (
    <button onClick={() => { navigator.clipboard.writeText(text); setCopied(true); setTimeout(()=>setCopied(false), 1500); }}
      className="no-print text-[11px] font-bold px-2.5 py-1 rounded-md bg-slate-700 hover:bg-slate-600 text-white transition">
      {copied ? "✓ 복사됨" : "📋 복사"}
    </button>
  );
};

const Code = ({children, copy}) => (
  <div className="relative group">
    <pre className="code bg-slate-900 text-slate-100 text-[12.5px] rounded-lg p-3 overflow-auto leading-relaxed">{children}</pre>
    <div className="absolute top-2 right-2"><CopyBtn text={copy || children}/></div>
  </div>
);

const Pill = ({color="slate", children}) => {
  const p = {
    blue:"bg-blue-50 text-blue-700 border-blue-200",
    green:"bg-emerald-50 text-emerald-700 border-emerald-200",
    amber:"bg-amber-50 text-amber-700 border-amber-200",
    rose:"bg-rose-50 text-rose-700 border-rose-200",
    violet:"bg-violet-50 text-violet-700 border-violet-200",
    slate:"bg-slate-100 text-slate-700 border-slate-200",
  }[color];
  return <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-bold border ${p}`}>{children}</span>;
};

const Step = ({id, n, title, est, tag, done, toggle, children, trouble}) => (
  <div className={`glass rounded-2xl p-5 transition ${done[id] ? "step-done" : ""}`}>
    <div className="flex items-start gap-3">
      <label className="cursor-pointer pt-0.5 no-print">
        <input type="checkbox" checked={!!done[id]} onChange={()=>toggle(id)}
          className="w-5 h-5 rounded accent-emerald-600"/>
      </label>
      <div className="flex-1">
        <div className="flex items-center gap-2 flex-wrap">
          <span className="text-[12px] font-bold text-slate-400">STEP {n}</span>
          {tag && <Pill color={tag.color}>{tag.label}</Pill>}
          {est && <span className="text-[11px] text-slate-500">⏱ {est}</span>}
        </div>
        <h3 className="step-title font-extrabold text-slate-900 text-[16px] mt-0.5">{title}</h3>
        <div className="text-[13px] text-slate-700 mt-2 space-y-2">{children}</div>
        {trouble && (
          <details className="mt-3 rounded-lg bg-amber-50 border border-amber-200 p-3 no-print">
            <summary className="text-[12px] font-bold text-amber-800"><span className="chev">▸</span> 트러블슈팅 ({trouble.length}건)</summary>
            <div className="mt-2 space-y-2 text-[12px] text-slate-700">
              {trouble.map((t,i)=>(
                <div key={i} className="border-t border-amber-200 pt-2 first:border-0 first:pt-0">
                  <div className="font-bold text-amber-900">증상: {t.symptom}</div>
                  <div className="mt-1">→ {t.fix}</div>
                </div>
              ))}
            </div>
          </details>
        )}
      </div>
    </div>
  </div>
);

const Phase = ({n, icon, title, accent, children}) => (
  <section className="space-y-3 mb-8">
    <h2 className="text-[20px] font-black tracking-tight text-slate-900 flex items-center gap-2 mt-8">
      <span className="text-2xl">{icon}</span>
      <span className={accent==="mac" ? "text-blue-700" : "text-emerald-700"}>Phase {n}</span>
      <span>·</span>
      <span>{title}</span>
    </h2>
    <div className="space-y-3">{children}</div>
  </section>
);

/* ========== Mac 단계 ========== */
const macPhases = [
  {
    n:1, icon:"🔊", title:"BlackHole 가상 오디오 드라이버 설치",
    steps:[
      {
        id:"mac-blackhole-dl", title:"BlackHole 2ch 다운로드 + 설치",
        est:"5분", tag:{color:"blue", label:"오디오"},
        content:(<>
          <p>공식 사이트에서 <b>BlackHole 2ch</b> 무료 버전 받기 (이름 / 이메일 입력).</p>
          <p>URL: <code className="bg-slate-100 px-1 rounded">https://existential.audio/blackhole/</code></p>
          <p>다운로드한 .pkg 실행 → 설치 마법사 진행 → 비밀번호 입력.</p>
        </>),
        trouble:[
          {symptom:"보안 경고로 차단됨", fix:"시스템 환경설정 → 개인정보 보호 및 보안 → 하단의 '확인 안 됨에도 열기' 클릭."},
          {symptom:"여전히 안 열림", fix:"sudo spctl --master-disable (개발 한정, 끝나면 다시 enable). 회의실 PC 보안 정책 확인."},
        ],
      },
      {
        id:"mac-blackhole-check", title:"설치 확인",
        est:"2분", tag:{color:"blue", label:"오디오"},
        content:(<>
          <p>Spotlight(⌘+Space) → "<b>Audio MIDI 설정</b>" 열기. 사이드바에 <b>BlackHole 2ch</b>가 보이면 OK.</p>
        </>),
        trouble:[
          {symptom:"BlackHole이 안 보임", fix:"재부팅 권장. 그래도 안 보이면 사이드바 좌하단 + 버튼 → 새로고침."},
        ],
      },
    ],
  },
  {
    n:2, icon:"🎛️", title:"멀티 출력 장치 만들기",
    steps:[
      {
        id:"mac-multi", title:"Audio MIDI에서 멀티 출력 장치 생성",
        est:"5분", tag:{color:"blue", label:"오디오"},
        content:(<>
          <ol className="list-decimal pl-5 space-y-1">
            <li>Audio MIDI 설정 열기.</li>
            <li>좌하단 <b>+</b> 버튼 → <b>"여러 출력 장치 생성"</b>.</li>
            <li>오른쪽 패널에서 <b>실제 스피커(또는 헤드셋)</b> + <b>BlackHole 2ch</b> 두 개 체크.</li>
            <li>"드리프트 보정"은 BlackHole 항목에 체크.</li>
            <li>장치 이름을 <b>yeson-meet Audio</b>로 변경 (사이드바에서 더블클릭).</li>
          </ol>
          <p>예시 결과:</p>
          <div className="glass rounded-lg p-3 text-[12px] code">
            yeson-meet Audio (멀티 출력 장치)<br/>
            ├─ ✅ 외장 스피커 (사람이 들음)<br/>
            └─ ✅ BlackHole 2ch (Python 앱이 받음)
          </div>
        </>),
      },
      {
        id:"mac-default", title:"시스템 출력을 멀티 장치로 변경",
        est:"1분", tag:{color:"blue", label:"오디오"},
        content:(<>
          <p>시스템 환경설정 → 사운드 → 출력 → <b>yeson-meet Audio</b> 선택.</p>
          <p>또는 Audio MIDI에서 해당 장치 우클릭 → "이 장치를 사운드 출력으로 사용".</p>
          <div className="rounded-lg bg-blue-50 border border-blue-200 p-3 text-[12.5px] text-blue-900">
            💡 이제 회의 소리가 동시에 <b>스피커</b>와 <b>BlackHole</b>로 흐릅니다. 사람은 듣고, 앱은 캡처.
          </div>
        </>),
        trouble:[
          {symptom:"소리가 안 들림", fix:"멀티 출력 장치 안에 실제 스피커가 체크되어 있는지 확인. 볼륨은 멀티 장치가 아니라 개별 스피커에서 조절."},
        ],
      },
    ],
  },
  {
    n:3, icon:"📦", title:"MVP-α sidecar 실행 준비",
    steps:[
      {
        id:"mac-runtime", title:"yeson-meet 폴더 + Python 런타임 준비",
        est:"10분", tag:{color:"violet", label:"CLI"},
        content:(<>
          <p>관리자에게 받은 <b>yeson-meet 프로젝트 폴더</b> 또는 배포 번들을 회의실 PC에 둡니다.</p>
          <p>현재 MVP-α는 데스크톱 DMG가 아니라 <b>Python sidecar CLI</b>로 실행합니다.</p>
          <Code>{`cd /path/to/yeson_meet
uv sync --all-packages`}</Code>
        </>),
        trouble:[
          {symptom:"uv 명령이 없음", fix:"Python 3.12와 uv를 먼저 설치하거나, 관리자가 준비한 .venv 포함 배포 폴더를 사용."},
        ],
      },
      {
        id:"mac-cert", title:"사내 root CA 인증서 신뢰 등록 (사내 CA 또는 Caddy internal 사용 시)",
        est:"5분", tag:{color:"rose", label:"보안"},
        content:(<>
          <p>관리자에게 받은 <code className="bg-slate-100 px-1 rounded">root.crt</code> 파일을 더블클릭.</p>
          <p>키체인 접근 → 시스템 → 가져온 인증서 더블클릭 → "이 인증서를 사용할 때" → <b>항상 신뢰</b>.</p>
        </>),
      },
    ],
  },
  {
    n:4, icon:"🚀", title:"sidecar 실행값 입력 + 실행",
    steps:[
      {
        id:"mac-values", title:"관리자에게 받은 실행값 확인",
        est:"3분", tag:{color:"amber", label:"등록"},
        content:(<>
          <p>회의실 PC에는 아래 값만 들어갑니다. <b>Gemini API Key는 서버에만 둡니다.</b></p>
          <ul className="list-disc pl-5 space-y-1">
            <li><code className="bg-slate-100 px-1 rounded">SERVER_WS_BASE=wss://&lt;server-host&gt;</code></li>
            <li><code className="bg-slate-100 px-1 rounded">YESON_DEVICE_API_KEY=&lt;plaintext-device-key&gt;</code></li>
            <li><code className="bg-slate-100 px-1 rounded">YESON_SESSION_ID=&lt;session-uuid&gt;</code></li>
            <li>viewer 확인용 <code className="bg-slate-100 px-1 rounded">VIEWER_URL</code></li>
          </ul>
        </>),
      },
      {
        id:"mac-run", title:"audio mode로 sidecar 실행",
        est:"2분", tag:{color:"violet", label:"CLI"},
        content:(<>
          <Code>{`SERVER_WS_BASE=wss://<server-host> \\
YESON_DEVICE_API_KEY=<plaintext-device-key> \\
YESON_SESSION_ID=<session-uuid> \\
YESON_SIDECAR_MODE=audio \\
uv run python -m apps.client_sidecar.main`}</Code>
          <p>성공하면 터미널에 <code className="bg-slate-100 px-1 rounded">sidecar audio mode</code>와 <code className="bg-slate-100 px-1 rounded">audio ws connected</code> 로그가 보입니다.</p>
        </>),
        trouble:[
          {symptom:"Invalid device key", fix:"관리자에게 새 Device API Key를 발급받아 다시 실행."},
          {symptom:"서버 연결 실패", fix:"SERVER_WS_BASE가 wss:// 서버 주소인지, 회의실 PC에서 해당 호스트에 접근 가능한지 확인."},
        ],
      },
    ],
  },
  {
    n:5, icon:"🎤", title:"오디오 캡처 + 자막 E2E 검증",
    steps:[
      {
        id:"mac-input", title:"입력 장치 자동 인식 확인",
        est:"2분", tag:{color:"blue", label:"오디오"},
        content:(<>
          <p>sidecar는 기본적으로 이름에 <b>BlackHole</b>이 들어간 입력 장치를 자동 선택합니다.</p>
          <p>자동 인식이 안 되면 아래 중 하나를 추가합니다.</p>
          <Code>{`YESON_AUDIO_DEVICE_NAME='(?i)blackhole'
# 또는 정확한 sounddevice index를 알 때
YESON_AUDIO_DEVICE_INDEX=8`}</Code>
        </>),
      },
      {
        id:"mac-mic-permission", title:"마이크 권한 허용",
        est:"1분", tag:{color:"rose", label:"권한"},
        content:(<>
          <p>처음 캡처 시도 시 macOS가 마이크 권한을 요청. 허용.</p>
          <p>또는 시스템 환경설정 → 개인정보 보호 → 마이크 → 실행에 사용한 Terminal/iTerm/Python 항목을 허용.</p>
        </>),
        trouble:[
          {symptom:"권한 후에도 무음", fix:"시스템 사운드 출력이 yeson-meet Audio(멀티 출력 장치)로 설정되어 있는지 재확인."},
        ],
      },
      {
        id:"mac-test", title:"자막 출력 확인 (영어 영상 재생)",
        est:"5분", tag:{color:"green", label:"검증"},
        content:(<>
          <p><b>선택 CLI 스모크 방법:</b></p>
          <ol className="list-decimal pl-5 space-y-1 text-[12.5px]">
            <li>YouTube 또는 Google Meet에서 영어 영상 재생.</li>
            <li>시스템 출력이 yeson-meet Audio (멀티 출력 장치)로 설정되어 있어 자동으로 BlackHole 경유.</li>
            <li>viewer URL을 폰/브라우저에서 열고 한국어 자막이 흐르는지 확인합니다. 이 full E2E는 Windows 앱 출시 전에는 선택 검증입니다.</li>
            <li>서버 audio stats에서 약 50 chunks/sec가 유지되는지 확인.</li>
          </ol>
        </>),
        trouble:[
          {symptom:"자막이 안 나옴", fix:"sidecar 로그의 audio ws connected, 서버 /api/v1/health/ai configured=true, viewer URL 접근 여부를 순서대로 확인."},
          {symptom:"자막이 끊김", fix:"네트워크 점검. 사내 서버까지 ping 응답 시간 확인."},
          {symptom:"chunks/sec가 50보다 낮음", fix:"멀티 출력 장치, Drift Correction, BlackHole 입력 선택, CPU 부하를 확인."},
        ],
      },
    ],
  },
];

/* ========== Windows 단계 ========== */
const winPhases = [
  {
    n:1, icon:"🛠️", title:"Windows 개발 도구 설치 (테스트 환경 1회 셋업)",
    steps:[
      {
        id:"win-prereq-install", title:"필수 도구 설치",
        est:"15분", tag:{color:"violet", label:"준비"},
        content:(<>
          <p>이번 테스트는 <b>Windows 회의실 PC에서 직접 yeson-meet 데스크탑 앱을 빌드</b>합니다. 그래서 아래 도구가 모두 필요합니다. 다 한 번씩만 설치하면 됩니다.</p>
          <ol className="list-decimal pl-5 space-y-2">
            <li>
              <b>Python 3.12 이상</b><br/>
              공식 사이트: <code className="bg-slate-100 px-1 rounded">https://www.python.org/downloads/windows/</code> — 설치 시 <b>“Add python.exe to PATH”</b> 체크박스를 켜야 합니다.
            </li>
            <li>
              <b>uv</b> (Python 의존성 매니저)<br/>
              PowerShell을 열고 다음 한 줄을 실행합니다:
              <Code>{`powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"`}</Code>
            </li>
            <li>
              <b>Node.js 20 LTS + pnpm</b><br/>
              Node.js: <code className="bg-slate-100 px-1 rounded">https://nodejs.org/en/download</code> — Windows Installer (LTS)을 받아 설치합니다.<br/>
              pnpm: 설치 후 PowerShell에서 <code className="bg-slate-100 px-1 rounded">npm install -g pnpm</code>
            </li>
            <li>
              <b>Rust toolchain</b> (Tauri 빌드용)<br/>
              <code className="bg-slate-100 px-1 rounded">https://rustup.rs/</code> 에서 <code className="bg-slate-100 px-1 rounded">rustup-init.exe</code>를 받아 실행합니다. 기본 옵션 그대로 Enter로 진행합니다.
            </li>
            <li>
              <b>Visual Studio Build Tools 2022</b> (Tauri/Rust가 필요로 하는 MSVC 컴파일러)<br/>
              <code className="bg-slate-100 px-1 rounded">https://visualstudio.microsoft.com/visual-cpp-build-tools/</code> 에서 받아 설치할 때 <b>“Desktop development with C++”</b> 워크로드만 체크합니다.
            </li>
            <li>
              <b>Git for Windows</b><br/>
              <code className="bg-slate-100 px-1 rounded">https://git-scm.com/download/win</code> — 설치 시 기본 옵션으로 두면 PowerShell에서도 <code className="bg-slate-100 px-1 rounded">git</code> 명령이 동작합니다.
            </li>
            <li>
              <b>WebView2 Runtime</b> (Tauri 앱이 화면을 띄울 때 사용)<br/>
              Windows 11에는 보통 이미 설치돼 있습니다. 없으면 <code className="bg-slate-100 px-1 rounded">https://developer.microsoft.com/microsoft-edge/webview2/</code> 에서 “Evergreen Standalone Installer”를 받아 설치합니다.
            </li>

        </div>
        <p className="text-[13px] text-slate-700 mb-3">
          사내용 빠른 테스트는 “설치 파일 + 서버 주소 + 테스트 계정”만 먼저 챙기는 방식으로 진행합니다. 아래에서 고급 항목은 문제 해결이나 오디오 full test 때만 사용합니다.
        </p>
        <div className="mb-3 rounded-lg bg-blue-50 border border-blue-200 p-3 text-[12.5px] text-blue-900">
          <b>지금처럼 이 컴퓨터가 서버라면:</b> 회의실 PC에서 쓸 서버 주소는 보통 <code className="bg-white px-1 rounded text-[11px]">wss://192.168.0.38</code> 입니다.
          viewer 주소는 <code className="bg-white px-1 rounded text-[11px]">https://192.168.0.38/v/&lt;token&gt;</code> 형태입니다.
          단, 서버의 <code className="bg-white px-1 rounded text-[11px]">SERVER_HOST</code>도 <code className="bg-white px-1 rounded text-[11px]">192.168.0.38</code>로 맞춘 뒤 Caddy를 다시 띄워야 HTTPS/WSS 인증서가 맞습니다.
        </div>
        <div className="grid md:grid-cols-2 gap-3 text-[13px] text-slate-700">
          <div className="rounded-lg bg-slate-50 border border-slate-200 p-3">
            <div className="font-extrabold text-slate-900">☐ WebSocket 서버 주소</div>
            <code className="bg-slate-100 px-1 rounded text-[11px]">wss://&lt;server-host&gt;</code>
            <p className="mt-1 text-[12px]">회의실 PC가 오디오를 보내는 서버 주소입니다. 쉽게 말해 “회의 소리를 보낼 목적지”입니다.</p>
          </div>
          <div className="rounded-lg bg-slate-50 border border-slate-200 p-3">
            <div className="font-extrabold text-slate-900">☐ 사내용 테스트 계정</div>
            <p className="mt-1 text-[12px]">Live Meeting에서 로그인할 email/password입니다. 운영자/토큰 같은 용어는 몰라도 됩니다.</p>
          </div>
          <div className="rounded-lg bg-slate-50 border border-slate-200 p-3">
            <div className="font-extrabold text-slate-900">☐ 테스트용 오디오 키 (필요 시)</div>
            <p className="mt-1 text-[12px]">자막 오디오까지 테스트할 때만 붙여넣는 값입니다. 앱 실행/회의 생성 확인만 할 때는 없어도 됩니다.</p>
          </div>
          <div className="rounded-lg bg-slate-50 border border-slate-200 p-3">
            <div className="font-extrabold text-slate-900">☐ viewer 확인 URL</div>
            <code className="bg-slate-100 px-1 rounded text-[11px]">https://&lt;server-host&gt;/v/&lt;token&gt;</code>
            <p className="mt-1 text-[12px]">회의를 만들면 앱이 보여주는 주소입니다. 처음부터 준비하지 않아도 됩니다.</p>
          </div>
          <div className="rounded-lg bg-slate-50 border border-slate-200 p-3">
            <div className="font-extrabold text-slate-900">☐ root.crt (고급/필요 시)</div>
            <code className="bg-slate-100 px-1 rounded text-[11px]">root.crt</code>
            <p className="mt-1 text-[12px]">평소에는 건너뜁니다. HTTPS 보안 경고가 뜨는 배포/확장 상황에서만 설치합니다.</p>
          </div>
          <div className="rounded-lg bg-slate-50 border border-slate-200 p-3">
            <div className="font-extrabold text-slate-900">☐ Windows 앱 설치 파일</div>
            <p className="mt-1 text-[12px]">GitHub Actions artifact <b>yeson-meet-desktop-windows</b>에서 받은 설치 파일입니다. 일반 회의실 PC에는 이 앱만 설치합니다.</p>
          </div>
        </div>
        <div className="mt-3 rounded-lg bg-rose-50 border border-rose-200 p-3 text-[12.5px] text-rose-800">
          🔐 <b>회의실 PC에는 절대 Gemini API Key를 두지 않습니다.</b> 사내용 빠른 테스트에서도 AI 호출은 모두 사내 서버 경유입니다.
        </div>
      </div>

      {/* Progress */}
      <div className="glass rounded-2xl p-5 mb-8 sticky top-3 z-10 no-print">
        <div className="flex items-center justify-between mb-2">
          <span className="font-extrabold text-slate-900">
            {os==="mac"?"🍎 Mac":"🪟 Windows"} 진행 — {completed}/{total} 완료 ({pct}%)
          </span>
          <button onClick={()=>{ if(confirm("이 OS의 진행 상태를 초기화할까요?")) reset(); }}
            className="text-[11px] font-bold text-slate-500 hover:text-rose-600">↺ 진도 리셋</button>
        </div>
        <div className="h-3 bg-slate-200 rounded-full overflow-hidden">
          <div className={`h-full transition-all duration-300 ${os==="mac"?"bg-gradient-to-r from-blue-500 to-violet-500":"bg-gradient-to-r from-emerald-500 to-blue-500"}`} style={{width:`${pct}%`}}/>
        </div>
        <div className="text-[11px] text-slate-500 mt-2">체크 상태는 이 브라우저 · 이 OS 탭에 저장됨. Mac/Win 진도는 분리 관리.</div>
      </div>

      {/* Phases */}
      {phases.map(p => (
        <Phase key={p.n} n={p.n} icon={p.icon} title={p.title} accent={os}>
          {p.steps.map((s,i)=>(
            <Step key={s.id} id={s.id} n={`${p.n}.${i+1}`} title={s.title} est={s.est} tag={s.tag}
              done={done} toggle={toggle} trouble={s.trouble}>
              {s.content}
            </Step>
          ))}
        </Phase>
      ))}

      {/* 다음 단계 */}
      <div className="glass rounded-2xl p-5 mt-12 border-l-4 border-emerald-400">
        <h3 className="font-extrabold text-slate-900 text-[16px] mb-2">✅ 셋업 완료 후</h3>
        <ul className="text-[13px] text-slate-700 space-y-1 list-disc pl-5">
          <li>관리자가 viewer 접속용 QR을 회의실 모니터에 띄울 수 있는지 확인.</li>
          <li>다음 회의실 PC가 있으면 이 가이드 처음부터 다시 (진도 리셋).</li>
          <li>이상 발견 시 사내 서버 셋업 가이드의 트러블슈팅도 참조.</li>
        </ul>
      </div>

      <footer className="mt-16 pt-6 border-t border-slate-200 text-center text-[12px] text-slate-400">
        <p>관련 문서: <code className="bg-slate-100 px-1.5 py-0.5 rounded text-slate-600">docs/DEPLOY.md · docs/ARCHITECTURE.md</code></p>
        <p className="mt-1">서버 셋업은 <b>SETUP_SERVER.html</b> 별도 가이드 참조.</p>
        <p className="mt-3 no-print">
          <button onClick={()=>window.print()} className="text-[11px] font-bold px-3 py-1 rounded bg-slate-700 text-white">🖨 인쇄용 보기</button>
        </p>
      </footer>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
