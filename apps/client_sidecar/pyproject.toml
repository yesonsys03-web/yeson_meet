[project]
name = "yeson-meet-client-sidecar"
version = "0.0.0"
description = "yeson-meet client sidecar (audio capture & transport)"
requires-python = ">=3.12"
dependencies = [
  "websockets>=13.1",
  "httpx>=0.27",
  "sounddevice>=0.5",
  "numpy>=2.1",
  "samplerate>=0.2.1",
  "truststore>=0.10.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
]
