[package]
name = "yeson-meet-desktop"
version = "0.0.0"
description = "yeson-meet operator desktop"
edition = "2021"
rust-version = "1.77"
default-run = "yeson-meet-desktop"

[lib]
name = "yeson_meet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
mdns-sd = "0.20"
hostname = "0.4.2"
# 대용량 mp4 일괄 다운로드용 — 서버에서 받아 파일로 바로 쓴다(플러그인 fs 스코프·IPC 우회).
# 윈도우 native-tls(SChannel) 이슈를 피하려 rustls-tls 사용(교훈: rustls/ring이 윈도우 안전).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
