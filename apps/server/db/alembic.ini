[alembic]
script_location = apps/server/db/alembic
prepend_sys_path = .
# Authoritative URL is injected by env.py via the DATABASE_URL environment
# variable. The placeholder below exists only so alembic can parse the config;
# never trusted at runtime.
sqlalchemy.url = driver://placeholder:placeholder@localhost/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
