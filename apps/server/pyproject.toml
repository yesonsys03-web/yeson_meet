[project]
name = "yeson-meet-server"
version = "0.0.0"
description = "yeson-meet FastAPI server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic-settings>=2.6",
  "PyJWT>=2.9",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.2,<5",
  "greenlet>=3.1",
  "websockets>=13.1",
  "python-multipart>=0.0.12",
  "psycopg[binary]>=3.2",
  "google-genai>=2.4.0",
  "google-cloud-speech>=2.39.0",
  "google-cloud-translate>=3.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]
