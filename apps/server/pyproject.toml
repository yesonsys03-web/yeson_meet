[project]
name = "yeson-meet-server"
version = "0.0.0"
description = "yeson-meet FastAPI server"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pydantic-settings>=2.6",
  "PyJWT>=2.9",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.2,<5",
  "greenlet>=3.1",
  "websockets>=13.1",
  "python-multipart>=0.0.12",
  "psycopg[binary]>=3.2",
  "google-genai>=2.10.0",
  "google-cloud-speech>=2.39.0",
  "google-cloud-translate>=3.26.0",
  "python-docx>=1.1",
  "yt-dlp>=2025.6.9",
  "faster-whisper>=1.1",
  "rapidocr-onnxruntime>=1.3",
  "pymupdf>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.optional-dependencies]
# 하이브리드 B(MLX 로컬 번역) — 실리콘맥 전용. 서버 본체 import와 무관하며
# 워커 진입점(run_worker/run_download)에서만 지연 import된다.
mlx = ["mlx-lm>=0.31; sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]
