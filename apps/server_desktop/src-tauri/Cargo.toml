[package]
name = "yeson-server-console"
version = "0.0.0"
description = "yeson-meet server operator console"
edition = "2021"
rust-version = "1.77"
default-run = "yeson-server-console"

[lib]
name = "yeson_server_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# OS keychain for the server config/secrets blob (same backends as the client
# app's credentials store). getrandom mints the generated-once JWT_SECRET;
# base64 url-safe-encodes it to match the server seeder's key shape.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
getrandom = "0.2"
base64 = "0.22"

[dev-dependencies]
ureq = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
