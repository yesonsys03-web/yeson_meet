[package]
name = "yeson-server-console"
version = "0.0.0"
description = "yeson-meet server operator console"
edition = "2021"
rust-version = "1.77"
default-run = "yeson-server-console"

[lib]
name = "yeson_server_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# OS keychain for the server config/secrets blob (same backends as the client
# app's credentials store). getrandom mints the generated-once JWT_SECRET;
# base64 url-safe-encodes it to match the server seeder's key shape.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
getrandom = "0.2"
base64 = "0.22"
# Viewer-only tunnel proxy (P4.1a). These are ALREADY in the dependency tree as
# transitive deps of tauri/wry (same versions resolved in Cargo.lock), so taking
# them as direct deps adds no new heavy compilation — it only enables building a
# minimal hyper-based path-allowlist reverse proxy + WS-upgrade splice for the
# viewer surface. Chosen over reqwest (no raw WS-upgrade proxying) and over a
# dedicated proxy crate (none needed: hyper's upgrade API relays the WS bytes).
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
regex = "1"
local-ip-address = "0.6"
mdns-sd = "0.20"
# Native folder picker for the backup panel (S2). Matches the codebase's
# plugin-free convention (custom command + `invoke`, like `open_log_dir`) rather
# than pulling tauri-plugin-dialog + capabilities. `xdg-portal` (not the default
# gtk3 backend) avoids a second GTK init alongside Tauri's webkit2gtk on Linux;
# mac/Windows use their native dialogs. `tokio` enables the async API so the
# modal runs off the command's await without blocking the UI thread.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }

[dev-dependencies]
ureq = "2"
filetime = "0.2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
