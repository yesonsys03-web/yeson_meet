name: Server console macOS installer

# Builds the macOS .dmg for the server console (apps/server_desktop) and
# publishes it as a prerelease asset. Manual-only (workflow_dispatch): macOS
# runners bill at 10x, so this never auto-runs on push — trigger from the
# Actions tab when a macOS build is wanted. Unsigned (ad-hoc, P9'): first launch
# via System Settings > Privacy & Security > "Open Anyway" (see docs/INSTALL.md).
on:
  workflow_dispatch:
  # Runs when THIS workflow file changes (registers it for dispatch + builds once);
  # plain code pushes never trigger it, so the 10x macOS cost stays opt-in.
  push:
    paths:
      - ".github/workflows/server-desktop-macos.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build + publish server console macOS installer
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Freeze the FastAPI server (PyInstaller --onedir, aarch64) + vendor
      # cloudflared, satisfying the tauri.conf bundle.resources globs.
      - name: Build + stage frozen server (+ cloudflared)
        run: bash apps/server_desktop/scripts/build-server.sh

      # macOS bundles only (the shared config also lists nsis/msi).
      - name: Build server console installer (app + dmg)
        working-directory: apps/server_desktop
        run: pnpm tauri build --bundles app dmg

      - name: List built installers
        run: find apps/server_desktop/src-tauri/target/release/bundle -name '*.dmg' -exec ls -lh {} \;

      # 릴리스 태그의 단일 출처 = tauri.conf.json 버전 (4개 워크플로 공통 규칙).
      - name: Read release version from tauri.conf
        shell: bash
        run: echo "VERSION=$(jq -r .version apps/server_desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - name: Publish installer to prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: yeson-meet v${{ env.VERSION }}
          prerelease: true
          body: |
            ## yeson-meet v1.1.0 — 무엇이 바뀌었나

            ### 서버 콘솔: 보고서 관리 탭 신규 📋
            - **모든 회의 보고서를 한곳에서** — 서버 콘솔에 "보고서 관리" 탭이 생겼습니다. 회의별 보고서를 목록으로 보고, 화면에서 바로 읽고(리뷰), MD·HTML·Word·PDF로 내려받고, 필요 없는 보고서 파일이나 회의 전체를 삭제할 수 있습니다.
            - **리뷰 화면 전환** — "리뷰"를 누르면 목록이 전체 화면 보기로 바뀌어 보고서와 요약을 탭으로 오가며 읽습니다.
            - **목록 페이지 이동** — 회의가 많아도 상단 페이지 버튼(처음·이전·다음·마지막)으로 넘겨 봅니다. "자막메이커 데이터 관리" 탭에도 동일 적용.
            - **용량 표시 정확도** — 보고서 사용량에 무관한 영상 파일까지 합산되던 문제를 고쳐 실제 보고서 용량만 보여줍니다.

            ### 자막 메이커: 일괄 처리 ⚡
            - **선택 굽기 / 선택 다운로드** — 작업마다 체크박스가 생겼습니다. 여러 영상을 골라(또는 전체 선택) 한 번에 굽고, 완료된 영상들을 폴더 하나만 골라 한꺼번에 저장합니다. 파일마다 반복 클릭할 필요가 없어요.
            - **저장 파일명 정리** — 완성 영상은 "원래이름_KO.mp4"로 저장됩니다.
            - **다른 드라이브 저장 지원** — 큰 영상을 홈 폴더 밖(예: 별도 드라이브)에도 안정적으로 저장하도록 개선했습니다.
            - **목록 페이지 이동** — 작업이 많으면 상단 페이지 버튼으로 넘겨 봅니다.

            ### 도움말 갱신 📖
            - 위 새 기능(일괄 처리, 보고서 관리)을 앱 안 도움말 매뉴얼에 반영했습니다.

            ### 참고
            - 기존 데이터(회의 기록·설정)를 그대로 유지한 채 업데이트됩니다.
            - 자산: macOS(Apple Silicon·Intel) + Windows, 클라이언트·서버 콘솔.
          files: |
            apps/server_desktop/src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
