name: Server console macOS installer

# Builds the macOS .dmg for the server console (apps/server_desktop) and
# publishes it to the versioned full release (vX.Y.Z), together with the updater
# artifact (.app.tar.gz + .sig) and the latest-server.json update manifest that
# the in-app updater polls. Manual-only (workflow_dispatch): macOS
# runners bill at 10x, so this never auto-runs on push — trigger from the
# Actions tab when a macOS build is wanted. Unsigned (ad-hoc, P9'): first launch
# via System Settings > Privacy & Security > "Open Anyway" (see docs/INSTALL.md).
on:
  workflow_dispatch:
  # Runs when THIS workflow file changes on main/server_add (registers it for
  # dispatch + builds once); plain code pushes never trigger it, so the 10x macOS
  # cost stays opt-in. The branches filter keeps release-branch pushes (which edit
  # the release body below) from double-triggering before the merge.
  push:
    branches:
      - main
      - server_add
    paths:
      - ".github/workflows/server-desktop-macos.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build + publish server console macOS installer
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Freeze the FastAPI server (PyInstaller --onedir, aarch64) + vendor
      # cloudflared, satisfying the tauri.conf bundle.resources globs.
      - name: Build + stage frozen server (+ cloudflared)
        run: bash apps/server_desktop/scripts/build-server.sh

      # apple-live-translate(Swift)는 macOS 26.4 전용 API(preferredStrategy/
      # .lowLatency)를 쓰므로 26.4+ SDK가 필요하다. macOS 26 러너에는 Xcode
      # 26.4.1/26.5/26.6이 모두 있으니 설치된 26.x 중 최신을 명시 선택한다
      # (기본값에 의존하지 않음 — 이전에 글롭이 26.0.1을 집어 컴파일 실패한 사고
      # 재발 방지, 2026-07-13). 러너가 arm64라 아키텍처도 충족.
      - name: Select newest Xcode 26 (macOS 26.4+ SDK)
        run: |
          XC="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$XC" ]; then echo "no Xcode 26 found" >&2; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
      # Swift 바이너리를 빌드해 binaries/apple-translate-aarch64-apple-darwin/에
      # 스테이징 → arm 전용 config 글롭이 번들에 포함시킨다. 없으면 --config 빌드가
      # fail-loud라 실리콘 배포판에 apple 바이너리가 빠진 채 나갈 일은 없다.
      - name: Build + stage apple-live-translate (Apple Silicon)
        run: bash apps/native_helper_mac/scripts/build_apple_translate.sh

      # macOS bundles only (the shared config also lists nsis/msi).
      # arm 전용 config = 기본 글롭 + binaries/apple-translate-*/**/* (apple 포함).
      - name: Build server console installer (app + dmg)
        working-directory: apps/server_desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles app dmg --config src-tauri/tauri.macos-arm.conf.json

      - name: List built installers
        run: find apps/server_desktop/src-tauri/target/release/bundle -name '*.dmg' -exec ls -lh {} \;

      # 릴리스 태그의 단일 출처 = tauri.conf.json 버전 (4개 워크플로 공통 규칙).
      - name: Read release version from tauri.conf
        shell: bash
        run: echo "VERSION=$(jq -r .version apps/server_desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - name: Publish installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: yeson-meet v${{ env.VERSION }}
          body: |
            ## ⬇️ 무엇을 받아야 하나요?

            앱은 두 가지입니다 — **클라이언트**(회의 진행·자막, 각 직원 PC)와 **서버 콘솔**(담당자 1명). 본인 OS에 맞는 것 **하나만** 받으세요. 목록의 나머지 파일(`.sig`, `.app.tar.gz`, `latest-*.json`)은 **자동 업데이트용**이라 직접 받지 않습니다.

            | | Windows | Mac (Apple Silicon · M1 이상) | Mac (Intel) |
            |---|---|---|---|
            | **클라이언트** (직원) | `yeson-meet_${{ env.VERSION }}_x64-setup.exe` | `yeson-meet_${{ env.VERSION }}_aarch64.dmg` | `yeson-meet_${{ env.VERSION }}_x64.dmg` |
            | **서버 콘솔** (담당자) | `yeson-server-console_${{ env.VERSION }}_x64-setup.exe` | `yeson-server-console_${{ env.VERSION }}_aarch64.dmg` | `yeson-server-console_${{ env.VERSION }}_x64.dmg` |

            > - **Mac 칩 확인**: 애플 메뉴 → 이 Mac에 관하여 → "Apple M…"이면 Apple Silicon, "Intel"이면 Intel.
            > - **Windows**: `-setup.exe`(권장) 또는 `_en-US.msi` 중 하나.
            > - **v1.2.0 이상을 이미 설치했다면** 이 버전은 앱이 **자동으로** 받습니다("재시작하여 적용" 배너). 아래는 처음 설치·재설치용 링크입니다.

            ---

            ## yeson-server-console v1.7.7 — 무엇이 바뀌었나

            ### 씬 스캔: Seq↔Seg 머리글자 오독을 통일합니다
            - 슬레이트의 `Seq`가 `Seg`로(또는 반대로) 읽혀 같은 시퀀스가 두 갈래로 쪼개지던 문제를 고쳤습니다. 쇼 전체의 다수 표기 기준으로 통일하고, 클라이언트에서 "예시 슬레이트"를 선언하면 그 구조가 다수결보다 우선합니다.

            ### 경계 오류 검사의 오탐을 고쳤습니다
            - 이웃 씬 라벨이 접두가 잘린 오독(`18A_S01`)이면 멀쩡한 경계까지 통째로 혼입 취급되던 구멍과, 판독이 깨진 이웃이 모든 경계에 걸리던 구멍을 막았습니다.
            - 규칙을 다시 확정하면 옛 검사 결과를 버립니다 — 이전 배치 기준의 "경계 오류"가 라벨이 우연히 같은 구간에 유령처럼 되살아나던 문제가 사라집니다.

            ### 자동 업데이트 ✅
            - v1.2.0 이상을 설치하셨다면 이 버전은 자동으로 받게 됩니다.

            ### 참고
            - 기존 데이터를 그대로 유지한 채 업데이트됩니다.
            - 씬 검수 도구 개선(예시 슬레이트·일괄 이름 바꾸기)은 클라이언트 쪽 변경입니다 — **클라이언트도 v1.7.7로 함께 업데이트**해 주세요.
          files: |
            apps/server_desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/server_desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/server_desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          fail_on_unmatched_files: true

      - name: Merge server entry into update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          REPO: ${{ github.repository }}
          MANIFEST: latest-server.json
          PLATFORM_KEY: darwin-aarch64
          ARTIFACT_GLOB: apps/server_desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
        run: bash .github/scripts/merge-update-manifest.sh
