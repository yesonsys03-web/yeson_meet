name: Server console macOS installer

# Builds the macOS .dmg for the server console (apps/server_desktop) and
# publishes it to the versioned full release (vX.Y.Z), together with the updater
# artifact (.app.tar.gz + .sig) and the latest-server.json update manifest that
# the in-app updater polls. Manual-only (workflow_dispatch): macOS
# runners bill at 10x, so this never auto-runs on push — trigger from the
# Actions tab when a macOS build is wanted. Unsigned (ad-hoc, P9'): first launch
# via System Settings > Privacy & Security > "Open Anyway" (see docs/INSTALL.md).
on:
  workflow_dispatch:
  # Runs when THIS workflow file changes (registers it for dispatch + builds once);
  # plain code pushes never trigger it, so the 10x macOS cost stays opt-in.
  push:
    paths:
      - ".github/workflows/server-desktop-macos.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build + publish server console macOS installer
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Freeze the FastAPI server (PyInstaller --onedir, aarch64) + vendor
      # cloudflared, satisfying the tauri.conf bundle.resources globs.
      - name: Build + stage frozen server (+ cloudflared)
        run: bash apps/server_desktop/scripts/build-server.sh

      # macOS bundles only (the shared config also lists nsis/msi).
      - name: Build server console installer (app + dmg)
        working-directory: apps/server_desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles app dmg

      - name: List built installers
        run: find apps/server_desktop/src-tauri/target/release/bundle -name '*.dmg' -exec ls -lh {} \;

      # 릴리스 태그의 단일 출처 = tauri.conf.json 버전 (4개 워크플로 공통 규칙).
      - name: Read release version from tauri.conf
        shell: bash
        run: echo "VERSION=$(jq -r .version apps/server_desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - name: Publish installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: yeson-meet v${{ env.VERSION }}
          body: |
            ## yeson-server-console v1.2.0 — 무엇이 바뀌었나

            ### 웹에서 실시간 자막 서빙 (신기능) 🌐
            - 서버가 웹 캡처 페이지(`/capture`)를 직접 서빙합니다. 진행자가 **앱 설치 없이** 브라우저(Chrome/Edge)로 실시간 자막을 켤 수 있어요. Go Live 공유 주소 뒤에 `/capture`만 붙이면 됩니다.

            ### 자동 업데이트 (첫 탑재) 🔄
            - 이번 버전을 설치하면, **다음 버전부터는 재설치가 필요 없습니다.** 새 버전이 나오면 콘솔이 알아서 받아 두고 "재시작하여 적용" 한 번이면 끝나요.

            ### 자막 메이커: 취소가 진짜 취소됩니다 🛑
            - 취소 시 즉시 '취소됨' + 진행률 초기화, 백그라운드 변환(ffmpeg)·전사도 즉시/조기 종료. 전체 취소 API 추가.
            - 취소·재생성 후 남은 작업이 진행률을 덮어쓰던 문제(대기 중 77% 등)를 근본 수정했습니다.

            ### 참고
            - 이번 버전은 **마지막 수동 설치**입니다(자동 업데이트는 이번 버전 설치 후부터 동작).
            - 기존 데이터(회의 기록·설정)를 그대로 유지한 채 업데이트됩니다.
          files: |
            apps/server_desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/server_desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/server_desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          fail_on_unmatched_files: true

      - name: Merge server entry into update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          REPO: ${{ github.repository }}
          MANIFEST: latest-server.json
          PLATFORM_KEY: darwin-aarch64
          ARTIFACT_GLOB: apps/server_desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
        run: bash .github/scripts/merge-update-manifest.sh
