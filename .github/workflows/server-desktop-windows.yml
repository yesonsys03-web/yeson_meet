name: Server console Windows installer

# Builds the DISTRIBUTABLE Windows installer (.msi + NSIS .exe) for the server
# console app (apps/server_desktop), so it can be downloaded and installed on a
# real Windows machine and tested end-to-end the same way it was on macOS
# (run console -> Start -> client connects -> live subtitles).
#
# This is unsigned (P9'): SmartScreen "More info -> Run anyway" — see docs/INSTALL.md.
#
# It also implicitly exercises the P0.1 freeze on Windows: it runs build-server.ps1
# (PyInstaller --onedir of the FastAPI server). If that freeze fails, this build
# fails — which is itself the P0 signal (-> P0.4 uv-launcher contingency).
#
# Delivery: the installer is published as a **versioned full-release asset**
# (vX.Y.Z, plus the NSIS updater .sig and the latest-server.json update manifest),
# NOT an Actions artifact, because Actions artifact STORAGE can be full (the
# 0.5GB included pool) while a multi-hundred-MB frozen-server installer needs
# room; release assets live in a separate, effectively-unlimited pool. Download
# it from the repo's Releases.
#
# 2026-07-31 (v1.8.0 재실행 트리거): 이 워크플로만 실패했다 — 동결·PDF/리포트/
# 검색 스모크·cloudflared까지 전부 통과한 뒤 ffmpeg 벤더링에서 죽었다. 고정해 둔
# BtbN autobuild 태그(2026-07-15)가 업스트림에서 삭제돼 URL이 404가 됐기 때문이다
# (BtbN은 autobuild를 약 11일치만 보관한다). ffmpeg.lock.json을 살아 있는 태그로
# 재핀했고, 이 주석이 **이 워크플로 하나만** 다시 돌리는 트리거다 — paths 필터가
# 자기 파일만 보므로 이미 업로드된 나머지 3개 빌드의 자산은 건드려지지 않는다.
# (릴리스가 이미 존재하는 상태의 workflow_dispatch는 자산·노트를 덮어쓸 수 있어
#  금지 — 복구는 항상 '해당 워크플로 파일을 고치는 후속 PR 머지'로 한다.)
on:
  workflow_dispatch:
  # Release-only auto-run: every release commit edits this workflow's body, so
  # merging a release PR triggers exactly one build. Plain code merges used to
  # match apps/** paths and silently OVERWRITE the released vX.Y.Z assets with
  # unreleased builds — on v1.2.2 this actually corrupted latest-server.json
  # (manifest/installer signature mismatch). On-demand builds for feature
  # branches remain available via workflow_dispatch. Mirrors windows-desktop.yml.
  push:
    branches: [main, server_add]
    paths:
      - ".github/workflows/server-desktop-windows.yml"

permissions:
  contents: write   # publish the installer as a release asset

jobs:
  build:
    name: Build + publish server console Windows installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Freeze the FastAPI server (PyInstaller --onedir) + vendor cloudflared, so
      # the tauri.conf bundle.resources globs (binaries/yeson-server-*,
      # binaries/cloudflared-*) are satisfied. This is also the P0.1 freeze gate.
      - name: Build + stage frozen server (+ cloudflared)
        shell: pwsh
        run: pwsh -File apps/server_desktop/scripts/build-server.ps1

      # Full Tauri build, Windows installers only (the config also lists the
      # macOS app/dmg targets; --bundles overrides to the Windows-valid set).
      - name: Build server console installer (nsis + msi)
        shell: pwsh
        working-directory: apps/server_desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles nsis msi

      - name: List built installers
        shell: pwsh
        run: Get-ChildItem -Recurse apps/server_desktop/src-tauri/target/release/bundle -Include *.exe,*.msi | Select-Object FullName, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      # Publish to the versioned full release (updater manifest is merged in the
      # step after) — avoids the full Actions artifact-storage quota. Download
      # from repo -> Releases.
      # 릴리스 태그의 단일 출처 = tauri.conf.json 버전. 4개 워크플로가 각자
      # 여기서 읽어 v${VERSION}으로 발행하므로, 버전을 tauri.conf에서만 올리면
      # 되고 자산이 서로 다른 태그로 흩어질 일이 없다.
      - name: Read release version from tauri.conf
        shell: bash
        run: echo "VERSION=$(jq -r .version apps/server_desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - name: Publish installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: yeson-meet v${{ env.VERSION }}
          body: |
            ## ⬇️ 무엇을 받아야 하나요?

            앱은 두 가지입니다 — **클라이언트**(회의 진행·자막, 각 직원 PC)와 **서버 콘솔**(담당자 1명). 본인 OS에 맞는 것 **하나만** 받으세요. 목록의 나머지 파일(`.sig`, `.app.tar.gz`, `latest-*.json`)은 **자동 업데이트용**이라 직접 받지 않습니다.

            | | Windows | Mac (Apple Silicon · M1 이상) | Mac (Intel) |
            |---|---|---|---|
            | **클라이언트** (직원) | `yeson-meet_${{ env.VERSION }}_x64-setup.exe` | `yeson-meet_${{ env.VERSION }}_aarch64.dmg` | `yeson-meet_${{ env.VERSION }}_x64.dmg` |
            | **서버 콘솔** (담당자) | `yeson-server-console_${{ env.VERSION }}_x64-setup.exe` | `yeson-server-console_${{ env.VERSION }}_aarch64.dmg` | `yeson-server-console_${{ env.VERSION }}_x64.dmg` |

            > - **Mac 칩 확인**: 애플 메뉴 → 이 Mac에 관하여 → "Apple M…"이면 Apple Silicon, "Intel"이면 Intel.
            > - **Windows**: `-setup.exe`(권장) 또는 `_en-US.msi` 중 하나.
            > - **v1.2.0 이상을 이미 설치했다면** 이 버전은 앱이 **자동으로** 받습니다("재시작하여 적용" 배너). 아래는 처음 설치·재설치용 링크입니다.

            ---

            ## yeson-server-console v1.8.0 — 무엇이 바뀌었나

            ### 새 기능: 스토리보드 PDF 번역 엔진 📄
            클라이언트의 새 "스토리보드 번역" 탭이 쓰는 번역 엔진이 서버에 들어왔습니다. **이 버전으로 올려야 그 탭이 동작합니다.**

            - **원본을 건드리지 않습니다**: 그림·레이아웃은 그대로 두고 한국어 주석만 얹습니다.
            - **사람 납품본 관례를 따릅니다**: 대사는 "화자명:대사" 형태로, 화면 밖 대사는 `아나운서(씬밖):`처럼 표기하고, 브랜드·스폰서명은 뜻을 옮기지 않고 소리대로 적습니다. 액션 노트는 평서형("…한다"), 제작진 지시문만 요청형("…하세요")으로 구분합니다.
            - **여러 페이지에 걸친 대사를 한 덩어리로 번역합니다** — `(CONT.)`로 잘린 문장이 어순 붕괴 없이 이어집니다.
            - **판넬 안 메모도 읽습니다**: 빨간 콜아웃 라벨과 `CAM GUIDE` 같은 제작 지시어를 화면에서 읽어 옮깁니다. 순수 코드(`1000SB` 등)와 그림 속 간판은 번역하지 않습니다.
            - **숫자를 지킵니다**: 씬 번호·컷 번호가 번역 과정에서 바뀌지 않도록 검사하고, 원본 PDF의 글자가 깨져 있으면 그 부분만 화면에서 다시 읽어 복구합니다.
            - **1단·3단 판넬, 가로·세로형 모두** 처리합니다.

            ### ⚠️ 꼭 알아두실 점 — 오래된 번역 작업이 자동으로 정리됩니다
            - PDF 번역 작업은 **최근 10건만 보관**됩니다. **서버가 켜질 때마다** 그리고 새 작업을 만들 때마다, 그보다 오래된 작업의 **원본·번역본 파일과 DB 기록이 삭제**됩니다.
            - 따라서 **이미 10건 넘게 쌓아두셨다면 이 버전으로 올린 뒤 첫 실행에서 오래된 작업이 사라집니다.** 버그가 아니라 정해진 동작이지만, 기존 데이터가 지워지는 변경이라 미리 알려드립니다.
            - 근거: 작업 1건이 실측 약 300MB(원본 129MB + 번역본 약 180MB)라 상한이 없으면 개인 디스크를 무한정 잠식합니다.
            - **보관이 필요한 번역본은 미리 내려받아 두세요.** 진행 중(대기·추출·번역·주석) 작업은 아무리 오래돼도 지우지 않습니다.

            ### 자동 업데이트 ✅
            - v1.2.0 이상을 설치하셨다면 이 버전은 자동으로 받게 됩니다.

            ### 참고
            - 회의록·자막 등 기존 데이터는 그대로 유지된 채 업데이트됩니다(위 PDF 작업 정리만 예외).
            - 클라이언트에 새 탭이 함께 들어갔습니다 — **클라이언트도 v1.8.0으로 함께 업데이트**해 주세요.
          files: |
            apps/server_desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/server_desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            apps/server_desktop/src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: true

      - name: Merge server entry into update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          REPO: ${{ github.repository }}
          MANIFEST: latest-server.json
          PLATFORM_KEY: windows-x86_64
          ARTIFACT_GLOB: apps/server_desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
        run: bash .github/scripts/merge-update-manifest.sh
