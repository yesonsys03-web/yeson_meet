name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - server_add
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "apps/client_sidecar/**"
      - "apps/desktop/**"
      - "apps/native_helper_win/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: write   # publish the client installer as a release asset

jobs:
  build:
    name: Build Windows sidecar and desktop installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --all-packages --frozen

      - name: Build sidecar executable
        shell: pwsh
        run: |
          uv run --with pyinstaller pyinstaller --noconfirm --clean --onefile --name yeson-sidecar --paths . --collect-all sounddevice --collect-all samplerate --collect-all numpy apps/client_sidecar/main.py
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries
          Copy-Item dist/yeson-sidecar.exe apps/desktop/src-tauri/binaries/yeson-sidecar-x86_64-pc-windows-msvc.exe

      - name: Build native audio helper
        shell: pwsh
        run: |
          cargo build --release --manifest-path apps/native_helper_win/Cargo.toml --bin yeson-win-audio-helper
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries
          Copy-Item apps/native_helper_win/target/release/yeson-win-audio-helper.exe apps/desktop/src-tauri/binaries/yeson-win-audio-helper-x86_64-pc-windows-msvc.exe

      - name: Build Tauri Windows installer
        shell: pwsh
        run: |
          $iconPath = "apps/desktop/src-tauri/icons/icon.ico"
          if (!(Test-Path $iconPath)) {
            $pixels = New-Object byte[] (16 * 16 * 4)
            for ($i = 0; $i -lt $pixels.Length; $i += 4) {
              $pixels[$i] = 0x28
              $pixels[$i + 1] = 0x7A
              $pixels[$i + 2] = 0xE6
              $pixels[$i + 3] = 0xFF
            }
            $mask = New-Object byte[] 64
            $stream = New-Object System.IO.MemoryStream
            $writer = New-Object System.IO.BinaryWriter($stream)
            $writer.Write([UInt16]0)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]1)
            $writer.Write([Byte]16)
            $writer.Write([Byte]16)
            $writer.Write([Byte]0)
            $writer.Write([Byte]0)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]32)
            $writer.Write([UInt32](40 + $pixels.Length + $mask.Length))
            $writer.Write([UInt32]22)
            $writer.Write([UInt32]40)
            $writer.Write([Int32]16)
            $writer.Write([Int32]32)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]32)
            $writer.Write([UInt32]0)
            $writer.Write([UInt32]$pixels.Length)
            $writer.Write([Int32]0)
            $writer.Write([Int32]0)
            $writer.Write([UInt32]0)
            $writer.Write([UInt32]0)
            $writer.Write($pixels)
            $writer.Write($mask)
            $writer.Flush()
            [System.IO.File]::WriteAllBytes($iconPath, $stream.ToArray())
          }
          $baseConfigPath = "apps/desktop/src-tauri/tauri.conf.json"
          $baseConfig = Get-Content $baseConfigPath -Raw | ConvertFrom-Json
          $windowsConfig = Get-Content apps/desktop/src-tauri/tauri.windows.conf.json -Raw | ConvertFrom-Json
          $baseConfig.bundle = $windowsConfig.bundle
          $baseConfig | ConvertTo-Json -Depth 20 | Set-Content $baseConfigPath
          pnpm --filter @yeson-meet/desktop tauri:build

      # Artifact uploads are best-effort: the 0.5GB Actions artifact-storage pool
      # can be full, which must not fail the build — the installer is delivered
      # via the prerelease below (release assets use a separate storage pool).
      - name: Upload sidecar executable
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yeson-sidecar-windows
          path: dist/yeson-sidecar.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload desktop installer bundle
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yeson-meet-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
          retention-days: 7

      # Publish the CLIENT installer to a rolling prerelease (like the server
      # console), so it can be downloaded from the repo's Releases page without
      # touching the full Actions artifact-storage quota.
      - name: Publish client installer to prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.19
          name: yeson-meet v0.9.19
          prerelease: true
          body: |
            ## yeson-meet v0.9.19 — 무엇이 바뀌었나
            - **라이브 자막 페이싱 수정**: 자막 한 줄이 실제 발화된 길이만큼 화면에 머물도록 개선했습니다. 기존엔 한 줄이 최대 5.5초만 표시돼, 긴 문장이 다 읽히기 전에 다음으로 넘어가거나 여러 줄이 우르르 빠르게 지나가는(자막이 튀는) 현상이 있었습니다. 이제 말한 시간에 맞춰 표시되어 읽기 편합니다.
            - v0.9.18의 전체화면 자막 크기 고정, v0.9.17의 자막 콜드스타트·깜박임·재시작 수정 포함.

            ### Windows 클라이언트
            Unsigned Windows test build of the yeson-meet desktop CLIENT app
            (apps/desktop), rebuilt on each run. Install with the .msi: it is
            launched by the trusted Windows Installer and strips the
            downloaded-file mark, so SmartScreen does not block install or
            first launch (same as the server console). Then pair it to your
            running server console. (The NSIS .exe is intentionally not
            published — a downloaded unsigned .exe trips SmartScreen.)
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: true
