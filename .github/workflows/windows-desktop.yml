name: Windows desktop build

on:
  workflow_dispatch:
  # Release-only auto-run: every release commit edits this workflow's body, so
  # merging a release PR triggers exactly one build. Plain code merges used to
  # match apps/** paths and silently OVERWRITE the released vX.Y.Z assets with
  # unreleased builds (bit us on v1.2.2) — hence the narrow filter. On-demand
  # builds for feature branches remain available via workflow_dispatch.
  push:
    branches:
      - main
      - server_add
    paths:
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: write   # publish the client installer as a release asset

jobs:
  build:
    name: Build Windows sidecar and desktop installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: uv sync --all-packages --frozen

      - name: Build sidecar executable
        shell: pwsh
        run: |
          uv run --with pyinstaller pyinstaller --noconfirm --clean --onefile --name yeson-sidecar --paths . --collect-all sounddevice --collect-all samplerate --collect-all numpy apps/client_sidecar/main.py
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries
          Copy-Item dist/yeson-sidecar.exe apps/desktop/src-tauri/binaries/yeson-sidecar-x86_64-pc-windows-msvc.exe

      - name: Build native audio helper
        shell: pwsh
        run: |
          cargo build --release --manifest-path apps/native_helper_win/Cargo.toml --bin yeson-win-audio-helper
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries
          Copy-Item apps/native_helper_win/target/release/yeson-win-audio-helper.exe apps/desktop/src-tauri/binaries/yeson-win-audio-helper-x86_64-pc-windows-msvc.exe

      - name: Build Tauri Windows installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $iconPath = "apps/desktop/src-tauri/icons/icon.ico"
          if (!(Test-Path $iconPath)) {
            $pixels = New-Object byte[] (16 * 16 * 4)
            for ($i = 0; $i -lt $pixels.Length; $i += 4) {
              $pixels[$i] = 0x28
              $pixels[$i + 1] = 0x7A
              $pixels[$i + 2] = 0xE6
              $pixels[$i + 3] = 0xFF
            }
            $mask = New-Object byte[] 64
            $stream = New-Object System.IO.MemoryStream
            $writer = New-Object System.IO.BinaryWriter($stream)
            $writer.Write([UInt16]0)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]1)
            $writer.Write([Byte]16)
            $writer.Write([Byte]16)
            $writer.Write([Byte]0)
            $writer.Write([Byte]0)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]32)
            $writer.Write([UInt32](40 + $pixels.Length + $mask.Length))
            $writer.Write([UInt32]22)
            $writer.Write([UInt32]40)
            $writer.Write([Int32]16)
            $writer.Write([Int32]32)
            $writer.Write([UInt16]1)
            $writer.Write([UInt16]32)
            $writer.Write([UInt32]0)
            $writer.Write([UInt32]$pixels.Length)
            $writer.Write([Int32]0)
            $writer.Write([Int32]0)
            $writer.Write([UInt32]0)
            $writer.Write([UInt32]0)
            $writer.Write($pixels)
            $writer.Write($mask)
            $writer.Flush()
            [System.IO.File]::WriteAllBytes($iconPath, $stream.ToArray())
          }
          $baseConfigPath = "apps/desktop/src-tauri/tauri.conf.json"
          $baseConfig = Get-Content $baseConfigPath -Raw | ConvertFrom-Json
          $windowsConfig = Get-Content apps/desktop/src-tauri/tauri.windows.conf.json -Raw | ConvertFrom-Json
          $baseConfig.bundle = $windowsConfig.bundle
          $baseConfig | ConvertTo-Json -Depth 20 | Set-Content $baseConfigPath
          pnpm --filter @yeson-meet/desktop tauri:build

      # Artifact uploads are best-effort: the 0.5GB Actions artifact-storage pool
      # can be full, which must not fail the build — the installer is delivered
      # via the versioned release below (release assets use a separate storage pool).
      - name: Upload sidecar executable
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yeson-sidecar-windows
          path: dist/yeson-sidecar.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload desktop installer bundle
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: yeson-meet-desktop-windows
          path: |
            apps/desktop/src-tauri/target/release/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
          retention-days: 7

      # Publish the CLIENT installer to the versioned full release (like the
      # server console) — with the NSIS updater .sig; the latest-client.json
      # update manifest is merged in the step after — so it can be downloaded
      # from the repo's Releases page without touching the full Actions
      # artifact-storage quota.
      # 릴리스 태그의 단일 출처 = tauri.conf.json 버전 (4개 워크플로 공통 규칙).
      # windows-desktop은 위 빌드 step에서 tauri.conf.json의 .bundle만 덮어쓰므로
      # .version은 보존됨 — 여기서 읽어도 안전.
      - name: Read release version from tauri.conf
        shell: bash
        run: echo "VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - name: Publish client installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: yeson-meet v${{ env.VERSION }}
          body: |
            ## ⬇️ 무엇을 받아야 하나요?

            앱은 두 가지입니다 — **클라이언트**(회의 진행·자막, 각 직원 PC)와 **서버 콘솔**(담당자 1명). 본인 OS에 맞는 것 **하나만** 받으세요. 목록의 나머지 파일(`.sig`, `.app.tar.gz`, `latest-*.json`)은 **자동 업데이트용**이라 직접 받지 않습니다.

            | | Windows | Mac (Apple Silicon · M1 이상) | Mac (Intel) |
            |---|---|---|---|
            | **클라이언트** (직원) | `yeson-meet_${{ env.VERSION }}_x64-setup.exe` | `yeson-meet_${{ env.VERSION }}_aarch64.dmg` | `yeson-meet_${{ env.VERSION }}_x64.dmg` |
            | **서버 콘솔** (담당자) | `yeson-server-console_${{ env.VERSION }}_x64-setup.exe` | `yeson-server-console_${{ env.VERSION }}_aarch64.dmg` | `yeson-server-console_${{ env.VERSION }}_x64.dmg` |

            > - **Mac 칩 확인**: 애플 메뉴 → 이 Mac에 관하여 → "Apple M…"이면 Apple Silicon, "Intel"이면 Intel.
            > - **Windows**: `-setup.exe`(권장) 또는 `_en-US.msi` 중 하나.
            > - **v1.2.0 이상을 이미 설치했다면** 이 버전은 앱이 **자동으로** 받습니다("재시작하여 적용" 배너). 아래는 처음 설치·재설치용 링크입니다.

            ---

            ## yeson-meet v1.7.3 — 무엇이 바뀌었나

            ### 자막 메이커: 슬레이트를 못 읽던 쇼를 읽습니다 🔍
            - **밑줄이 공백으로 읽히는 슬레이트** — 구역을 정확히 잡았는데도 "판독 실패"가 뜨던 쇼가 있었습니다. 슬레이트의 `_`가 판독기에서 공백으로 나오는 경우인데(실측 12프레임 중 12), 이제 공백도 필드 구분자로 인정합니다. 같은 소스에서 판독이 9/12 → 12/12로 올랐습니다. 스캔 결과가 `FL102 I032`처럼 공백으로 들어오면 화면의 **"공백도 구분자로 나누기"**를 켜 주세요.
            - **닮은꼴 글자·숫자 교정** — `O001`을 `0001`로, `I016`을 `1016`으로 읽던 오독을 자동으로 되돌립니다. 작품 포맷을 정해 두는 게 아니라 그 작품의 라벨 다수가 어떤 모양인지 보고 판단합니다. 실기 299씬에서 어긋난 라벨 60개가 0개가 됐고, 같은 씬이 두 갈래로 읽혀 쪼개져 있던 7건이 합쳐졌습니다.

            ### 씬 검수: 어디를 눌러야 할지 보입니다 👀
            - **병합 버튼에 이웃 씬 이름** — `◀ Scene656` `Scene659 ▶`처럼 실제로 합쳐질 상대의 이름이 버튼에 적힙니다. 오독 필터를 걸면 정작 병합 대상이 목록에서 빠져 무엇을 누를지 알 수 없던 문제입니다. 라벨이 거의 같은 쪽에는 초록 테두리로 힌트를 줍니다(자동으로 누르지는 않습니다).
            - **오독 목록이 정직해졌습니다** — 번호가 1~3자리로 늘어나는 작품(Scene1 … Scene678)에서 멀쩡한 씬 수백 개가 오독으로 잡히던 문제를 고쳤습니다. 실기 321씬 기준 오독 목록 180행 → 89행, 그중 멀쩡한 라벨은 0개입니다. 한 번에 고칠 수 있는 교정 제안도 39건으로 늘었습니다.
            - **팝업 단축키** — `G`/`H`로 이전·다음 씬, `[`/`]`로 머리·꼬리 프레임 이동. 기존 `I`/`O`(In/Out 트림), `←`/`→`(한 프레임)와 함께 손을 옮기지 않고 검수할 수 있습니다. 한글 입력 상태에서도 동작합니다.

            ### 익스포트: 서버가 다른 PC여도 내 폴더에 저장됩니다 💾
            - 서버와 클라이언트가 **다른 컴퓨터**일 때 씬별·시퀀스별 익스포트를 눌러도 파일이 안 생기던 문제를 고쳤습니다. 저장 폴더 선택창은 내 PC에서 뜨는데 파일은 서버가 자기 디스크에 쓰고 있었습니다(에러도 없이). 이제 서버가 자른 클립을 앱이 받아 고른 폴더에 저장하고, 다 받은 뒤 서버 사본을 정리합니다. 누르는 단계는 그대로 하나입니다.

            ### 스캔이 멀쩡한데 실패로 뜨던 문제 ⏱️
            - "스캔이 진행되지 않습니다"가 뜬 뒤에도 서버는 정상적으로 끝내고 있었습니다. 판독이 끝난 뒤 도는 재시도 단계가 진행률을 알리지 않아 멈춘 것으로 오판한 것입니다. 이제 그 구간도 진행 상황을 보여줍니다.
            - 스캔 도중 서버를 재시작하면 화면이 영원히 "실행중"으로 남던 문제도 고쳤습니다.

            ### 윈도우에서 글자가 안 보이던 두 곳 🩹
            - 설정 화면 입력칸에 입력한 글자와 "방식" 드롭다운 목록이 보이지 않던 문제(v1.7.2 회귀)를 고쳤습니다.
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          fail_on_unmatched_files: true

      - name: Merge client entry into update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          REPO: ${{ github.repository }}
          MANIFEST: latest-client.json
          PLATFORM_KEY: windows-x86_64
          ARTIFACT_GLOB: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
        run: bash .github/scripts/merge-update-manifest.sh
