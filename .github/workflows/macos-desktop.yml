name: Client app macOS installer

# Builds the macOS .dmg for the desktop CLIENT (apps/desktop) and publishes it
# to the versioned full release (vX.Y.Z), together with the updater artifact
# (.app.tar.gz + .sig) and the latest-client.json update manifest that the
# in-app updater polls. Manual-only (workflow_dispatch): macOS runners bill at
# 10x, so this never auto-runs on push. On macOS, Tauri auto-merges
# tauri.macos.conf.json, whose beforeBuildCommand builds the Swift native helper
# + the PyInstaller sidecar + the frontend, then bundles them via externalBin.
# Unsigned (ad-hoc, P9'): first launch via Privacy & Security > "Open Anyway".
on:
  workflow_dispatch:
  # Runs when THIS workflow file changes (registers it for dispatch + builds once);
  # plain code pushes never trigger it, so the 10x macOS cost stays opt-in.
  push:
    paths:
      - ".github/workflows/macos-desktop.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build + publish client macOS installer
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Sidecar build (build:sidecar-mac, run inside tauri's beforeBuildCommand)
      # uses `uv run --project apps/client_sidecar pyinstaller` — sync deps first.
      - name: Sync Python deps
        run: uv sync --all-packages --frozen

      # tauri build auto-merges tauri.macos.conf.json → its beforeBuildCommand
      # builds the Swift helper + sidecar + frontend, then bundles. macOS targets
      # only (the shared config also lists nsis/msi).
      - name: Build client installer (app + dmg)
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles app dmg

      - name: List built installers
        run: find apps/desktop/src-tauri/target/release/bundle -name '*.dmg' -exec ls -lh {} \;

      # 릴리스 태그의 단일 출처 = tauri.conf.json 버전 (4개 워크플로 공통 규칙).
      - name: Read release version from tauri.conf
        shell: bash
        run: echo "VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - name: Publish installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: yeson-meet v${{ env.VERSION }}
          body: |
            ## yeson-meet v1.2.0 — 무엇이 바뀌었나

            ### 웹에서 실시간 자막 (신기능) 🌐
            - **앱 설치 없이** 브라우저로 실시간 자막을 켤 수 있습니다. 구글밋처럼 브라우저에서 하는 회의라면, 서버 공유 주소 뒤에 `/capture`를 붙여 Chrome/Edge로 접속 → 로그인 → 회의 만들기 → 구글밋 탭 선택(+'탭 오디오 공유' 체크)만 하면 됩니다.
            - 자막 미리보기·레벨미터·참석자 QR·F(자막)/Q(QR) 전체화면 단축키까지 앱과 동일하게 지원합니다.

            ### 자동 업데이트 (첫 탑재) 🔄
            - 이번 버전을 설치하면, **다음 버전부터는 재설치가 필요 없습니다.** 앱이 새 버전을 알아서 내려받고 "재시작하여 적용" 버튼 한 번이면 끝나요.
            - 왼쪽 아래 "지금 업데이트 확인"으로 직접 확인할 수도 있습니다. (Intel Mac은 자동 업데이트 대상이 아니라 기존처럼 수동 설치)

            ### 자막 메이커: 취소가 진짜 취소됩니다 🛑
            - 취소하면 즉시 **'취소됨'** 으로 표시되고 진행률이 0으로 초기화되며, 뒤에서 돌던 변환(ffmpeg)도 **즉시 종료**됩니다. 오류와 헷갈리지 않아요. 다시 하려면 '재생성'.
            - **'전체 취소' 버튼**이 생겨 여러 작업(업로드 중 포함)을 한 번에 멈출 수 있습니다.
            - **진행바가 항상 앞으로만** 갑니다(전사 15–60% · 번역 60–80% · 굽기 80–100%). 대기 중 작업에 엉뚱한 진행률이 표시되던 문제도 수정.
            - Windows 폴더 선택창에 파일이 안 보이는 건 Windows 기본 동작이라 안내를 추가했습니다(폴더를 고르면 안의 영상을 자동으로 찾습니다).

            ### 기타
            - 도움말에 '웹에서 쓰기'·'자동 업데이트' 섹션 추가, 업데이트 확인 문구 개선("업데이트 버전이 없습니다").

            ### 참고
            - 이번 버전은 **마지막 수동 설치**입니다(자동 업데이트는 이번 버전 설치 후부터 동작).
            - 기존 데이터(회의 기록·설정)를 그대로 유지한 채 업데이트됩니다.
            - 자산: macOS(Apple Silicon·Intel) + Windows, 클라이언트·서버 콘솔.
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          fail_on_unmatched_files: true

      - name: Merge client entry into update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          REPO: ${{ github.repository }}
          MANIFEST: latest-client.json
          PLATFORM_KEY: darwin-aarch64
          ARTIFACT_GLOB: apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
        run: bash .github/scripts/merge-update-manifest.sh
