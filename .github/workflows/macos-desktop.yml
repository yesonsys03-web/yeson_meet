name: Client app macOS installer

# Builds the macOS .dmg for the desktop CLIENT (apps/desktop) and publishes it
# as a prerelease asset. Manual-only (workflow_dispatch): macOS runners bill at
# 10x, so this never auto-runs on push. On macOS, Tauri auto-merges
# tauri.macos.conf.json, whose beforeBuildCommand builds the Swift native helper
# + the PyInstaller sidecar + the frontend, then bundles them via externalBin.
# Unsigned (ad-hoc, P9'): first launch via Privacy & Security > "Open Anyway".
on:
  workflow_dispatch:
  # Runs when THIS workflow file changes (registers it for dispatch + builds once);
  # plain code pushes never trigger it, so the 10x macOS cost stays opt-in.
  push:
    paths:
      - ".github/workflows/macos-desktop.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build + publish client macOS installer
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Sidecar build (build:sidecar-mac, run inside tauri's beforeBuildCommand)
      # uses `uv run --project apps/client_sidecar pyinstaller` — sync deps first.
      - name: Sync Python deps
        run: uv sync --all-packages --frozen

      # tauri build auto-merges tauri.macos.conf.json → its beforeBuildCommand
      # builds the Swift helper + sidecar + frontend, then bundles. macOS targets
      # only (the shared config also lists nsis/msi).
      - name: Build client installer (app + dmg)
        working-directory: apps/desktop
        run: pnpm tauri build --bundles app dmg

      - name: List built installers
        run: find apps/desktop/src-tauri/target/release/bundle -name '*.dmg' -exec ls -lh {} \;

      - name: Publish installer to prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.23
          name: yeson-meet v0.9.23
          prerelease: true
          body: |
            ## yeson-meet v0.9.23 — 무엇이 바뀌었나
            - **동시통역 자막 표시가 "문장 단위"로 안정화** — 완성된 문장이 한 번에 떠서 읽는 동안 바뀌지 않습니다(짧은 문장은 ~45자까지 한 줄로 병합). 자막 패널의 표시 버튼으로 실시간(라이브) 방식과 전환할 수 있습니다.
            - **자막 흐름 개선** — 다음 자막이 대기 중이면 더 빨리 전환되고, 전체화면(F) 자막의 좌우 출렁임을 수정했습니다.
            - **10분 이상 회의 안정화(gemini_live_translate)** — Live API 세션 한도(GoAway)에서 자막 유실 없이 새 세션으로 교체합니다.

            ### macOS 클라이언트
            Unsigned (ad-hoc) macOS test build of the yeson-meet desktop CLIENT
            app (apps/desktop), rebuilt on each run. First launch: System
            Settings > Privacy & Security > "Open Anyway" (see docs/INSTALL.md).
            Intel Mac는 `..._x64.dmg`, Apple Silicon은 `..._aarch64.dmg`를 받으세요.
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
