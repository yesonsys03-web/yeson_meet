name: Client app macOS installer

# Builds the macOS .dmg for the desktop CLIENT (apps/desktop) and publishes it
# to the versioned full release (vX.Y.Z), together with the updater artifact
# (.app.tar.gz + .sig) and the latest-client.json update manifest that the
# in-app updater polls. Manual-only (workflow_dispatch): macOS runners bill at
# 10x, so this never auto-runs on push. On macOS, Tauri auto-merges
# tauri.macos.conf.json, whose beforeBuildCommand builds the Swift native helper
# + the PyInstaller sidecar + the frontend, then bundles them via externalBin.
# Unsigned (ad-hoc, P9'): first launch via Privacy & Security > "Open Anyway".
on:
  workflow_dispatch:
  # Runs when THIS workflow file changes on main/server_add (registers it for
  # dispatch + builds once); plain code pushes never trigger it, so the 10x macOS
  # cost stays opt-in. The branches filter keeps release-branch pushes (which edit
  # the release body below) from double-triggering before the merge.
  push:
    branches:
      - main
      - server_add
    paths:
      - ".github/workflows/macos-desktop.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build + publish client macOS installer
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Sidecar build (build:sidecar-mac, run inside tauri's beforeBuildCommand)
      # uses `uv run --project apps/client_sidecar pyinstaller` — sync deps first.
      - name: Sync Python deps
        run: uv sync --all-packages --frozen

      # tauri build auto-merges tauri.macos.conf.json → its beforeBuildCommand
      # builds the Swift helper + sidecar + frontend, then bundles. macOS targets
      # only (the shared config also lists nsis/msi).
      - name: Build client installer (app + dmg)
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles app dmg

      - name: List built installers
        run: find apps/desktop/src-tauri/target/release/bundle -name '*.dmg' -exec ls -lh {} \;

      # 릴리스 태그의 단일 출처 = tauri.conf.json 버전 (4개 워크플로 공통 규칙).
      - name: Read release version from tauri.conf
        shell: bash
        run: echo "VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - name: Publish installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: yeson-meet v${{ env.VERSION }}
          body: |
            ## ⬇️ 무엇을 받아야 하나요?

            앱은 두 가지입니다 — **클라이언트**(회의 진행·자막, 각 직원 PC)와 **서버 콘솔**(담당자 1명). 본인 OS에 맞는 것 **하나만** 받으세요. 목록의 나머지 파일(`.sig`, `.app.tar.gz`, `latest-*.json`)은 **자동 업데이트용**이라 직접 받지 않습니다.

            | | Windows | Mac (Apple Silicon · M1 이상) | Mac (Intel) |
            |---|---|---|---|
            | **클라이언트** (직원) | `yeson-meet_${{ env.VERSION }}_x64-setup.exe` | `yeson-meet_${{ env.VERSION }}_aarch64.dmg` | `yeson-meet_${{ env.VERSION }}_x64.dmg` |
            | **서버 콘솔** (담당자) | `yeson-server-console_${{ env.VERSION }}_x64-setup.exe` | `yeson-server-console_${{ env.VERSION }}_aarch64.dmg` | `yeson-server-console_${{ env.VERSION }}_x64.dmg` |

            > - **Mac 칩 확인**: 애플 메뉴 → 이 Mac에 관하여 → "Apple M…"이면 Apple Silicon, "Intel"이면 Intel.
            > - **Windows**: `-setup.exe`(권장) 또는 `_en-US.msi` 중 하나.
            > - **v1.2.0 이상을 이미 설치했다면** 이 버전은 앱이 **자동으로** 받습니다("재시작하여 적용" 배너). 아래는 처음 설치·재설치용 링크입니다.

            ---

            ## yeson-meet v1.7.4 — 무엇이 바뀌었나

            ### 익스포트가 고른 폴더에 바로 저장됩니다 ⚡
            - 씬 익스포트가 **고른 폴더에 곧바로** 저장됩니다. v1.7.3에서는 서버가 자기 폴더에 클립을 만든 뒤 앱이 하나씩 받아 옮겼는데, 서버와 클라이언트가 같은 컴퓨터일 때는 같은 파일을 두 번 쓰는 셈이라 시간이 더 걸리고 저장 공간도 잠시 두 배로 필요했습니다.
            - **굽는 도중에** 클립이 폴더에 하나씩 쌓이는 게 보입니다. 전에는 전부 끝날 때까지 폴더가 비어 있어 잘 되고 있는지 알기 어려웠습니다.
            - **서버가 다른 컴퓨터에 있어도 그대로 안전합니다** — 폴더를 고른 직후 앱이 아주 짧게 확인해서, 서버가 그 폴더에 직접 쓸 수 있을 때만 바로 저장하고 아니면 v1.7.3처럼 받아서 저장합니다. 회사 공유 폴더(NAS)를 고르면 서버가 다른 PC여도 바로 저장됩니다.

            ### 그 밖에 🩹
            - 익스포트 뒷정리 중 파일을 지우지 못하는 드문 상황에서 오류가 나던 문제를 고쳤습니다.
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          fail_on_unmatched_files: true

      - name: Merge client entry into update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          REPO: ${{ github.repository }}
          MANIFEST: latest-client.json
          PLATFORM_KEY: darwin-aarch64
          ARTIFACT_GLOB: apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
        run: bash .github/scripts/merge-update-manifest.sh
