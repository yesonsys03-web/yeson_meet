name: Client app macOS installer

# Builds the macOS .dmg for the desktop CLIENT (apps/desktop) and publishes it
# as a prerelease asset. Manual-only (workflow_dispatch): macOS runners bill at
# 10x, so this never auto-runs on push. On macOS, Tauri auto-merges
# tauri.macos.conf.json, whose beforeBuildCommand builds the Swift native helper
# + the PyInstaller sidecar + the frontend, then bundles them via externalBin.
# Unsigned (ad-hoc, P9'): first launch via Privacy & Security > "Open Anyway".
on:
  workflow_dispatch:
  # Runs when THIS workflow file changes (registers it for dispatch + builds once);
  # plain code pushes never trigger it, so the 10x macOS cost stays opt-in.
  push:
    paths:
      - ".github/workflows/macos-desktop.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build + publish client macOS installer
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Sidecar build (build:sidecar-mac, run inside tauri's beforeBuildCommand)
      # uses `uv run --project apps/client_sidecar pyinstaller` — sync deps first.
      - name: Sync Python deps
        run: uv sync --all-packages --frozen

      # tauri build auto-merges tauri.macos.conf.json → its beforeBuildCommand
      # builds the Swift helper + sidecar + frontend, then bundles. macOS targets
      # only (the shared config also lists nsis/msi).
      - name: Build client installer (app + dmg)
        working-directory: apps/desktop
        run: pnpm tauri build --bundles app dmg

      - name: List built installers
        run: find apps/desktop/src-tauri/target/release/bundle -name '*.dmg' -exec ls -lh {} \;

      # 릴리스 태그의 단일 출처 = tauri.conf.json 버전 (4개 워크플로 공통 규칙).
      - name: Read release version from tauri.conf
        shell: bash
        run: echo "VERSION=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_ENV"

      - name: Publish installer to prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: yeson-meet v${{ env.VERSION }}
          prerelease: true
          body: |
            ## yeson-meet v1.0.2 — 무엇이 바뀌었나

            ### 자막 메이커 대폭 개선 🎬
            - **여러 영상 한 번에** — 로컬 파일을 여러 개 선택하거나 폴더째 넣으면, 폴더 안 영상들을 모두 불러와 순서대로 자막을 만듭니다. 전사 모델·번역 엔진은 고른 영상 전부에 똑같이 적용됩니다.
            - **순차 처리** — 여러 작업을 넣어도 서버가 한 번에 하나씩 처리해(자원 경합 방지) 안정적으로 끝냅니다. 기다리는 작업은 "대기 중"으로 표시됩니다.
            - **서버 콘솔 "자막메이커 데이터 관리" 탭 신규** — 만든 작업의 목록·용량을 보고, 개별 삭제하거나 완료된 작업을 한 번에 비울 수 있습니다. 오래된 작업은 최근 30개까지 자동 보관·정리됩니다.
            - **다운로드 진행 표시** — MP4/SRT 다운로드 버튼에 "준비 중… → 내려받는 중… → 저장됨" 표시. 모든 버튼에 클릭 피드백을 추가했습니다.
            - **전사 모델 기본값 base** + 전사 모델 관리 영역 접기.

            ### 버그 수정 🔧
            - **상단 자막 위치** — "상단"으로 구운 결과가 미리보기와 다르게 중앙에 나오던 문제를 수정했습니다.
            - **작업 목록 로드 오류** — 작업 목록이 "Load failed"로 뜨지 않던 문제를 수정했습니다(번들 DB 컬럼 자동 보강).
            - **진행 중 작업 삭제 시 정체** — 전사 중인 작업을 삭제하면 다음 작업들이 멈추던 문제를 수정했습니다(즉시 취소·다음 작업 진행).
            - **일괄 삭제 안전장치** — 완료 작업 일괄 삭제 시 지워질 목록을 먼저 보여주고 확인합니다.

            ### 참고
            - 기존 데이터(회의 기록·설정)를 그대로 유지한 채 업데이트됩니다.
            - 자산: macOS(Apple Silicon·Intel) + Windows, 클라이언트·서버 콘솔.
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
