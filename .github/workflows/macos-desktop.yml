name: Client app macOS installer

# Builds the macOS .dmg for the desktop CLIENT (apps/desktop) and publishes it
# as a prerelease asset. Manual-only (workflow_dispatch): macOS runners bill at
# 10x, so this never auto-runs on push. On macOS, Tauri auto-merges
# tauri.macos.conf.json, whose beforeBuildCommand builds the Swift native helper
# + the PyInstaller sidecar + the frontend, then bundles them via externalBin.
# Unsigned (ad-hoc, P9'): first launch via Privacy & Security > "Open Anyway".
on:
  workflow_dispatch:
  # Runs when THIS workflow file changes (registers it for dispatch + builds once);
  # plain code pushes never trigger it, so the 10x macOS cost stays opt-in.
  push:
    paths:
      - ".github/workflows/macos-desktop.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build + publish client macOS installer
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Sidecar build (build:sidecar-mac, run inside tauri's beforeBuildCommand)
      # uses `uv run --project apps/client_sidecar pyinstaller` — sync deps first.
      - name: Sync Python deps
        run: uv sync --all-packages --frozen

      # tauri build auto-merges tauri.macos.conf.json → its beforeBuildCommand
      # builds the Swift helper + sidecar + frontend, then bundles. macOS targets
      # only (the shared config also lists nsis/msi).
      - name: Build client installer (app + dmg)
        working-directory: apps/desktop
        run: pnpm tauri build --bundles app dmg

      - name: List built installers
        run: find apps/desktop/src-tauri/target/release/bundle -name '*.dmg' -exec ls -lh {} \;

      - name: Publish installer to prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: yeson-meet v1.0.0
          prerelease: true
          body: |
            ## yeson-meet v1.0.0 — 무엇이 바뀌었나
            ### 신규 기능: 자막 메이커 🎬
            - **영상에 한국어 자막 자동 생성** — 유튜브 URL을 붙여넣거나 내 컴퓨터의 동영상을 올리면, 말을 받아 적고(전사) 한국어로 번역해 자막을 만들어 줍니다. 클라이언트 앱 왼쪽 메뉴의 "자막 메이커" 탭에서 로그인 없이 바로 사용합니다.
            - **전사 모델 선택** — tiny(가장 빠름)부터 large-v3(최고 품질)까지 원하는 whisper 모델을 앱에서 직접 내려받아 선택합니다. 모델은 서버에 저장되며 설치 파일 크기에는 영향이 없습니다.
            - **번역 엔진 선택(작업별)** — 기본 Gemini API 외에 Claude·Codex·Antigravity·OpenCode(딥시크, 무료) 구독 CLI를 골라 쓸 수 있습니다. 서버에 설치되지 않은 엔진은 자동으로 비활성 표시됩니다.
            - **검수 화면** — 영상을 재생하며 자막을 미리 보고(완성본과 동일한 위치·크기·색), 자막 목록에서 시간을 눌러 장면으로 이동, 틀린 글자는 그 자리에서 수정합니다. 위치(상/하단)·여백·글자 크기(숫자 직접 입력)·색상을 자유롭게 조정합니다.
            - **읽기 좋은 자막 길이** — 자막이 최대 6초/90자 단위로, 문장부호를 우선해 자동 분할됩니다. 긴 자막이 화면을 덮는 일이 없습니다.
            - **진행률 표시** — 전사·번역·굽기 각 단계의 실제 진행률(%)과 진행바가 표시됩니다.
            - **굽기(burn-in)와 내보내기** — 자막을 영상에 새겨 넣은 MP4와 자막 파일(SRT)을 원하는 폴더·파일명으로 저장합니다.
            - **용어사전 연동** — 애니메이션 제작용어 사전(103종)이 전사와 번역 양쪽에 적용됩니다(cleanup→클린업 등).
            - 사용법은 앱의 Help Manual에 7단계로 정리되어 있습니다.

            ### 개선·안정성
            - **라이브 회의 자막 기본 엔진이 동시통역(gemini_live_translate)으로** 변경되어 더 정확한 실시간 자막을 제공합니다.
            - 서버가 재시작되면 진행 중이던 자막 작업이 오류로 정리되어 알 수 있습니다(무한 대기 방지). 서버 이중 실행 시 작업 오판 방지 가드 포함.
            - 패키징된 서버의 멀티프로세싱 유령 인스턴스 문제를 근본 수정(freeze_support).
            - 기존 데이터(회의 기록·설정)를 그대로 유지한 채 업데이트됩니다(DB 자동 보강).
            - Windows 대비: 한글 인코딩(utf-8) 강제, 콘솔 창 번쩍임 방지, CLI 자동 탐색(.cmd/.exe). Windows 실기기 검증은 진행 중입니다.

            ### macOS 클라이언트
            Unsigned (ad-hoc) macOS test build of the yeson-meet desktop CLIENT
            app (apps/desktop), rebuilt on each run. First launch: System
            Settings > Privacy & Security > "Open Anyway" (see docs/INSTALL.md).
            Intel Mac는 `..._x64.dmg`, Apple Silicon은 `..._aarch64.dmg`를 받으세요.
          files: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
